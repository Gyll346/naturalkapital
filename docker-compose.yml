services:
  # 1. PHP-FPM Service (Laravel Core App)
  ynki-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ynki_laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ynki-db
      DB_PORT: 3306
      DB_DATABASE: ynki_db
      DB_USERNAME: ynki_user
      DB_PASSWORD: ${DB_PASSWORD:-7ac4104004d447ceb8f8c51ebc5d29ec7977e336}
    networks:
      - ynki-network
    depends_on:
      - ynki-db

  # 2. Nginx Web Server Service
  ynki-nginx:
    image: nginx:alpine
    container_name: ynki_nginx_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ynki-network
    depends_on:
      - ynki-app

  # 3. Database Service (MariaDB 10.11 / MySQL Compatible)
  # Port 3306 diisolasi di dalam ynki-network, tidak diekspos ke publik
  ynki-db:
    image: mariadb:10.11
    container_name: ynki_mysql_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ynki_db
      MARIADB_USER: ynki_user
      MARIADB_PASSWORD: ${DB_PASSWORD:-7ac4104004d447ceb8f8c51ebc5d29ec7977e336}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-5d25bff413004d509a9512eec134d9f29e4219f0}
    volumes:
      - ynki_db_data:/var/lib/mysql
    networks:
      - ynki-network

  # 4. phpMyAdmin GUI Database Manager
  # Hanya dapat diakses secara lokal/SSH tunnel (127.0.0.1), tidak terbuka ke publik
  ynki-pma:
    image: phpmyadmin:latest
    container_name: ynki_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: ynki-db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - ynki-network
    depends_on:
      - ynki-db

volumes:
  ynki_db_data:
    driver: local

networks:
  ynki-network:
    driver: bridge
